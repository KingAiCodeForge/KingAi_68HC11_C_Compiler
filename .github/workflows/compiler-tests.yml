name: Compiler tests

on:
  push:
    branches:
      - main
      - "chatgpt/**"
      - "integration/**"
  pull_request:

jobs:
  software-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: python -m pip install ".[test]"
      - name: Syntax check
        run: python -m compileall -q hc11_compiler hc11cc.py hc11kcos.py hc11kit.py
      - name: Run compiler and linker tests
        run: python -m pytest tests/ -v --tb=short
      - name: Offline emulator and framing checks
        run: python -m pytest hc11_virtual_emulator/tests/test_emulator_core.py hc11_virtual_emulator/tests/test_scaffold_imports.py hc11_bench_incar_emulator/template_addresses_might_be_wrong/tests/test_aldl_frame.py -q
      - name: Installed command help
        run: |
          hc11cc --version
          hc11kit --help
          hc11kcos --help
