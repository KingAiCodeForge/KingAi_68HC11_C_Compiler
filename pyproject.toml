[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kingai-hc11-compiler"
version = "0.4.0a1"
description = "Experimental offline subset-C compiler, assembler and linker for Motorola 68HC11"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "KingAiCodeForge"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
hc11cc = "hc11cc:main"
hc11kit = "hc11kit:main"
hc11kcos = "hc11kcos:main"

[tool.setuptools]
packages = ["hc11_compiler"]
py-modules = ["hc11cc", "hc11kit", "hc11kcos"]
